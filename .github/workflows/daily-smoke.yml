name: Daily smoke

# Runs once a day against the deployed Vercel site. Doubles as the
# Supabase keepalive — the admin dashboard fires a SELECT against the
# `quotes` table on every run, which is the DB activity that prevents
# Supabase free-tier auto-pause.
#
# Once this has been green on schedule at least once, a follow-up PR
# will remove .github/workflows/supabase-keepalive.yml and drop the
# `public.keepalive` table via migration (see TASKS.md Step 5c).

on:
  schedule:
    # 00:00 UTC daily. Adjust if the deploy window or quiet hours change.
    - cron: "0 0 * * *"
  workflow_dispatch:

jobs:
  smoke:
    name: Admin auth + dashboard smoke
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright (chromium)
        run: npx playwright install --with-deps chromium

      - name: Run admin smoke test
        run: npx playwright test e2e/admin-smoke.spec.ts
        env:
          PLAYWRIGHT_BASE_URL: https://grow-modern-hub.vercel.app
          E2E_ADMIN_EMAIL: ${{ secrets.E2E_ADMIN_EMAIL }}
          E2E_ADMIN_PASSWORD: ${{ secrets.E2E_ADMIN_PASSWORD }}

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
